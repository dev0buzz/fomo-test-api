[variables]
NIXPACKS_PHP_ROOT_DIR = '/app/public'

[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
    'npm run build',
    'chmod -R 775 storage bootstrap/cache'
]

[start]
# config/route/view caching runs here (not in build) because Coolify only
# injects real env vars (APP_KEY, DB_*, etc.) at container runtime.
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
